naftiko: 1.0.0-alpha2
info:
  label: Inworld Realtime API — Sessions
  description: 'Inworld Realtime — bidirectional speech-to-speech sessions over
    WebSocket and WebRTC. OpenAI-Realtime-compatible event protocol with session.update,
    input_audio_buffer.append/commit, response.create, conversation.item.* events.
    JWT-based authentication.'
  tags:
  - Inworld
  - Realtime
  - Voice
  - WebSocket
  - WebRTC
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    INWORLD_REALTIME_JWT: INWORLD_REALTIME_JWT
capability:
  consumes:
  - type: http
    namespace: realtime-sessions
    baseUri: https://api.inworld.ai
    description: Inworld Realtime sessions — WebSocket upgrade + WebRTC offer/answer.
    resources:
    - name: realtime-websocket
      path: /api/v1/realtime/session
      operations:
      - name: realtimewebsocket
        method: GET
        description: Open Realtime WebSocket Session
        outputRawFormat: binary
    - name: realtime-webrtc
      path: /v1/realtime/webrtc
      operations:
      - name: realtimewebrtc
        method: POST
        description: Exchange WebRTC offer for answer
        outputRawFormat: json
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: bearer
      value: '{{env.INWORLD_REALTIME_JWT}}'
      placement: header
  exposes:
  - type: rest
    namespace: realtime-sessions-rest
    port: 8080
    description: REST adapter for Realtime WebRTC handshake.
    resources:
    - path: /v1/realtime/webrtc
      name: realtime-webrtc
      operations:
      - method: POST
        name: realtimewebrtc
        description: WebRTC Offer Exchange
        call: realtime-sessions.realtimewebrtc
        with:
          body: rest.body
  - type: mcp
    namespace: realtime-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Realtime sessions.
    tools:
    - name: inworld-realtime-webrtc-exchange
      description: Exchange a WebRTC offer to open a Realtime session.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: realtime-sessions.realtimewebrtc
      with:
        body: tools.body
