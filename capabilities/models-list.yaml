naftiko: 1.0.0-alpha2
info:
  label: Inworld Models API — Discovery
  description: 'Inworld Models — discover every model available across the Router
    and first-party TTS/STT/Realtime endpoints. 1 operation: List Models.'
  tags:
  - Inworld
  - Models
  - Discovery
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    INWORLD_API_KEY: INWORLD_API_KEY
capability:
  consumes:
  - type: http
    namespace: models-list
    baseUri: https://api.inworld.ai
    description: Inworld Models — model discovery endpoint.
    resources:
    - name: models
      path: /v1/models
      operations:
      - name: listmodels
        method: GET
        description: List Models
        outputRawFormat: json
        outputParameters:
        - name: data
          type: array
          value: $.data
    authentication:
      type: basic
      value: '{{env.INWORLD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: models-list-rest
    port: 8080
    description: REST adapter for Inworld Models.
    resources:
    - path: /v1/models
      name: models
      operations:
      - method: GET
        name: listmodels
        description: List Models
        call: models-list.listmodels
  - type: mcp
    namespace: models-list-mcp
    port: 9090
    transport: http
    description: MCP adapter for Inworld Models.
    tools:
    - name: inworld-list-models
      description: List all Inworld and Router-available models.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: models-list.listmodels
